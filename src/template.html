<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3857/3857575.png">
    <script src="https://kit.fontawesome.com/00250d9010.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Let's play Battleship!</h1>
        <!-- <h4>Instructions/Rules</h4> -->
        <!-- brief explanation of the game -->
        <!-- open a modal for the rules description -->
    </header>

    <main>
        <div id="gameButtons">
            <button id="startGameBtn">Start Game!</button>
            <button id="resetGameBtn">Reset Game</button>
        </div>
    
        <!-- This changes to "it's (players) turn!"" when game starts -->
        <p id="turnText">It's (players) turn!</p> <!--Update this dynamically to state who's turn it is-->
        <p id="gameText">Place your ships...</p> <!--Update this dynamically to post the result of the last turn, and eventually, who the winner is-->
    
        <div id="boardContainer">
            <!-- populate these boards with for loops on load -->
            <div id="leftPlayer">
                <h3 id="p1text">Player 1's board</h3>
                <div id="leftPlayerBoard"></div>
                <button id="placeShipBtn">Place A Ship</button>

                <div id="placeShipOverlay">
                    <div id="placeShipModal">
                        <form action="">
                            <label for="shipLength">Size</label>
                            <input type="number" name="shipLength" id="shipLength">

                            <label for="rowCoord">X</label>
                            <input type="text" id="rowCoord">
                            
                            <label for="columnCoord">Y</label>
                            <input type="text" id="columnCoord">

                            <select name="shipDirection" id="shipDirection">
                                <option value="up">Up</option>
                                <option value="right">Right</option>
                                <option value="down">Down</option>
                                <option value="left">Left</option>
                            </select>
                            
                            <button type="submit">Place Ship</button>
                        </form>
                    </div>
                </div>

            </div>

            <div id="rightPlayer">
                <h3 id="p2text">Player 2's board</h3>
                <div id="rightPlayerBoard"></div>
            </div>
    
            <div id="gameOverOverlay">
                <div id="gameOverModal">
                    <h2>Game Over!</h2>
                    <h3 id="winningText">The winner is ...!</h2>
                    <button id="restartGame">Restart Game</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>Copyright &copy; HWaterCoding</p>
        <a href="https://github.com/HWaterCoding" target="_blank"><i class="fa-brands fa-github"></i></a>
    </footer>

</body>
</html>
